<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovereign Flame Visual Study</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1d1b1a;
      --depth: #0f0f0f;
      --text: #e8dfd4;
      --muted: #b6ad9f;
      --accent: #a85a38;
      --accent-soft: rgba(168, 90, 56, 0.16);
      --border: rgba(232, 223, 212, 0.12);
      --surface: rgba(255,255,255,0.04);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, rgba(232,223,212,0.04), transparent 28%),
                  radial-gradient(circle at bottom right, rgba(182,94,55,0.08), transparent 18%),
                  var(--bg);
      color: var(--text);
      font-family: Inter, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 3rem 1.5rem;
    }

    .stage {
      width: min(100%, 72rem);
      padding: 3rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0.35rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), inset 0 0 0 2px rgba(0,0,0,0.12), 0 44px 110px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.1));
    }

    .stage::before,
    .stage::after {
      content: '';
      position: absolute;
      pointer-events: none;
    }

    .stage::before {
      left: 50%;
      top: 2.5rem;
      width: 0.12rem;
      height: 96%;
      transform: translateX(-50%);
      background: linear-gradient(to bottom, rgba(255,255,255,0.12), transparent 24%, transparent 76%, rgba(255,255,255,0.06));
    }

    .stage::after {
      top: 2.5rem;
      left: 0;
      width: 100%;
      height: 0.15rem;
      background: linear-gradient(90deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02), rgba(255,255,255,0.08));
    }

    .stage::before {
      top: 2.5rem;
    }

    .stage::after {
      top: 2.5rem;
      height: 0.15rem;
      width: 100%;
      left: 0;
      transform: none;
      background: linear-gradient(90deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02), rgba(255,255,255,0.08));
    }

    .visual-grid {
      display: grid;
      gap: 3rem;
      position: relative;
      z-index: 1;
    }

    .logo-frame {
      width: 5.5rem;
      height: 5.5rem;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 0.25rem;
      background: rgba(255,255,255,0.03);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 24px 42px rgba(0,0,0,0.35);
    }

    .logo-mark {
      max-width: 4.2rem;
      width: 100%;
      height: auto;
      display: block;
    }

    .hero {
      display: grid;
      gap: 1.5rem;
      max-width: 44rem;
    }

    .eyebrow {
      color: var(--muted);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .title {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(3.25rem, 5vw, 4.5rem);
      line-height: 0.94;
      letter-spacing: -0.04em;
      max-width: 12ch;
    }

    .support {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.95;
      max-width: 44rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .button {
      padding: 1rem 1.75rem;
      border-radius: 0.125rem;
      border: 1px solid transparent;
      font: 0.95rem/1.1 Inter, system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .button.primary {
      background: linear-gradient(180deg, rgba(168,90,56,0.96), rgba(120,55,33,0.92));
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 16px 30px rgba(0,0,0,0.22);
    }

    .button.secondary {
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-color: rgba(255,255,255,0.12);
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-1px);
    }

    .button.secondary:hover,
    .button.secondary:focus-visible {
      background: rgba(255,255,255,0.08);
    }

    @media (max-width: 640px) {
      .stage {
        padding: 2rem 1.5rem;
      }

      .visual-grid {
        gap: 2rem;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .logo-mark {
        width: 5rem;
        height: 5rem;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="visual-grid">
      <div class="logo-frame">
        <img src="./assets/sovereign-flame-logo.jpg" alt="Sovereign Flame logo" class="logo-mark" />
      </div>
      <section class="hero">
        <div class="eyebrow">Sovereign Flame</div>
        <h1 class="title">A provisional study in forged precision for ambitious, exacting work.</h1>
        <p class="support">A first-screen exploration of charcoal volume, contained furnace heat, and architectural restraint for a composed and capable workshop presence.</p>
        <div class="actions">
          <a href="#" class="button primary">Begin the study</a>
          <a href="#" class="button secondary">View the approach</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
